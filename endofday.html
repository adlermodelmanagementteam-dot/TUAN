<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', 'Consolas', monospace;
    background: linear-gradient(180deg, #0D0221 0%, #1B0A3F 40%, #3D1B6B 100%);
    padding: 24px;
    min-height: 100vh;
  }
  .menu {
    max-width: 720px;
    margin: 0 auto;
    background: #0D0221;
    border-radius: 8px;
    border: 4px solid #F0FF00;
    box-shadow:
      0 0 0 2px #0D0221,
      0 0 0 6px #00F0FF,
      0 0 20px #F0FF00,
      inset 0 0 30px rgba(240,255,0,0.1);
    padding: 28px;
    position: relative;
    overflow: hidden;
  }
  .scanlines {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 5;
  }
  .stars {
    position: absolute;
    color: #00F0FF;
    font-size: 14px;
    opacity: 0.6;
  }
  .header {
    text-align: center;
    margin-bottom: 18px;
    position: relative;
    z-index: 2;
  }
  .header h1 {
    font-size: 26px;
    color: #00F0FF;
    text-shadow:
      3px 3px 0 #A855F7,
      -1px -1px 0 #F0FF00,
      0 0 20px #00F0FF;
    letter-spacing: 2px;
    font-weight: bold;
  }
  .header .sub {
    font-size: 12px;
    color: #F0FF00;
    letter-spacing: 4px;
    margin-top: 6px;
    text-shadow: 0 0 8px #F0FF00;
  }
  .insert-coin {
    text-align: center;
    color: #FF2D95;
    font-size: 12px;
    letter-spacing: 2px;
    margin-top: 6px;
    animation: blink 1.2s infinite;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0.3; }
  }

  .field-group {
    position: relative;
    z-index: 2;
    margin-top: 18px;
  }
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .field-row3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .field-full { margin-bottom: 10px; }
  label.field-label {
    display: block;
    font-size: 10px;
    color: #F0FF00;
    letter-spacing: 1px;
    margin-bottom: 4px;
    text-shadow: 0 0 6px #F0FF00;
  }
  input[type="text"], textarea {
    width: 100%;
    font-family: 'Courier New', monospace;
    background: #1B0A3F;
    border: 2px solid #534AB7;
    color: #00F0FF;
    padding: 8px 10px;
    border-radius: 3px;
    font-size: 12px;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #F0FF00;
    box-shadow: 0 0 8px rgba(240,255,0,0.5);
  }
  textarea { resize: vertical; min-height: 50px; }

  .submit-area {
    position: relative;
    z-index: 2;
    margin-top: 18px;
    text-align: center;
  }
  .submit-btn {
    font-family: 'Courier New', monospace;
    background: #00F0FF;
    border: 2px solid #A855F7;
    color: #0D0221;
    padding: 12px 32px;
    border-radius: 3px;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(0,240,255,0.5);
  }
  .submit-btn:active { transform: scale(0.97); }
  #submitStatus {
    font-size: 11px;
    color: #F0FF00;
    margin-top: 10px;
    letter-spacing: 1px;
  }

  .footer {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #F0FF00;
    font-weight: bold;
    position: relative;
    z-index: 2;
    letter-spacing: 2px;
    text-shadow: 0 0 8px #F0FF00;
  }
  .ufo-row {
    font-size: 24px;
    margin: 10px 0;
    letter-spacing: 8px;
  }
  .high-score {
    text-align: center;
    font-size: 10px;
    color: #00F0FF;
    letter-spacing: 2px;
    margin-top: 8px;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div class="menu">
  <div class="scanlines"></div>
  <div class="stars" style="top: 20px; left: 25px;">★</div>
  <div class="stars" style="top: 50px; right: 30px;">★</div>
  <div class="stars" style="bottom: 40px; left: 40px;">★</div>
  <div class="stars" style="bottom: 90px; right: 25px;">★</div>

  <div class="header">
    <h1>👾 TUAN END OF DAY 🛸</h1>
    <div class="sub">‹ BOSS ROUND RECAP ›</div>
    <div class="insert-coin">▸ SUBMIT BEFORE YOU CLOCK OUT ◂</div>
  </div>

  <div class="field-group">

    <div class="field-row">
      <div>
        <label class="field-label">REP NAME</label>
        <input type="text" id="repName" placeholder="YOUR NAME">
      </div>
      <div>
        <label class="field-label">DATE</label>
        <input type="text" id="reportDate" placeholder="MM/DD">
      </div>
    </div>

    <div class="field-row3">
      <div>
        <label class="field-label">STORES VISITED</label>
        <input type="text" id="storesVisited" placeholder="#">
      </div>
      <div>
        <label class="field-label">SALES CLOSED</label>
        <input type="text" id="salesClosed" placeholder="#">
      </div>
      <div>
        <label class="field-label">TOTAL REVENUE</label>
        <input type="text" id="totalRevenue" placeholder="$0">
      </div>
    </div>

    <div class="field-full">
      <label class="field-label">BIGGEST WIN TODAY</label>
      <textarea id="biggestWin" placeholder="WHAT WENT RIGHT"></textarea>
    </div>

    <div class="field-full">
      <label class="field-label">BIGGEST BLOCKER</label>
      <textarea id="biggestBlocker" placeholder="WHAT GOT IN THE WAY"></textarea>
    </div>

    <div class="field-full">
      <label class="field-label">TOMORROW'S PLAN</label>
      <textarea id="tomorrowPlan" placeholder="WHAT'S THE MOVE"></textarea>
    </div>

    <div class="field-full">
      <label class="field-label">NOTES</label>
      <textarea id="notes" placeholder="ANYTHING ELSE TO FLAG"></textarea>
    </div>

  </div>

  <div class="submit-area">
    <button class="submit-btn" onclick="submitEOD()">▸ SUBMIT END OF DAY ◂</button>
    <div id="submitStatus"></div>
  </div>

  <div class="footer">
    <div class="ufo-row">👾 ▸ 👾 ▸ 👾 ▸ 👾</div>
    SHOW UP. LOG IT. CLOSE IT. PLANET TUAN.
  </div>
  <div class="high-score">HIGH SCORE: MOST SALES CLOSED IN A DAY</div>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzTTeMgGfG_IdFfIdtYs8rDwjOG7QBh3WqtwgQ1JvtLDpNlj2oBLhuuQJM8wI7KYLjn/exec";

function submitEOD() {
  const repName = document.getElementById('repName').value.trim();

  if (!repName) {
    document.getElementById('submitStatus').innerText = "▸ ENTER YOUR NAME FIRST ◂";
    document.getElementById('submitStatus').style.color = "#FF2D95";
    return;
  }

  const payload = {
    repName: repName,
    reportDate: document.getElementById('reportDate').value.trim(),
    storesVisited: document.getElementById('storesVisited').value.trim(),
    salesClosed: document.getElementById('salesClosed').value.trim(),
    totalRevenue: document.getElementById('totalRevenue').value.trim(),
    biggestWin: document.getElementById('biggestWin').value.trim(),
    biggestBlocker: document.getElementById('biggestBlocker').value.trim(),
    tomorrowPlan: document.getElementById('tomorrowPlan').value.trim(),
    notes: document.getElementById('notes').value.trim()
  };

  document.getElementById('submitStatus').innerText = "▸ TRANSMITTING... ◂";
  document.getElementById('submitStatus').style.color = "#00F0FF";

  fetch(SHEET_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload)
  }).then(() => {
    document.getElementById('submitStatus').innerText = "★ DAY COMPLETE ★ SEE YOU TOMORROW ★";
    document.getElementById('submitStatus').style.color = "#F0FF00";

    document.getElementById('reportDate').value = "";
    document.getElementById('storesVisited').value = "";
    document.getElementById('salesClosed').value = "";
    document.getElementById('totalRevenue').value = "";
    document.getElementById('biggestWin').value = "";
    document.getElementById('biggestBlocker').value = "";
    document.getElementById('tomorrowPlan').value = "";
    document.getElementById('notes').value = "";
  }).catch(() => {
    document.getElementById('submitStatus').innerText = "▸ CONNECTION FAILED — TRY AGAIN ◂";
    document.getElementById('submitStatus').style.color = "#FF2D95";
  });
}
</script>
</body>
</html>
